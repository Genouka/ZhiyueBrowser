        * {

            padding: 0;
            box-sizing: border-box;

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, #0f0f0f 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            color: white;
        }

        .clock {
            font-size: 2.5rem;
            font-weight: 200;
            margin: 15px 0 5px;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        .date {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid {
            width: 100%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .site-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .site-card:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.15);
        }

        .icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .bilibili { background: #FB7299; }
        .youtube { background: #FF0000; }
        .google { background: #4285F4; }
        .github { background: #333; border: 1px solid #555; }
        .twitter { background: #000; border: 1px solid #333; }
        .reddit { background: #FF4500; }

        .site-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .site-name {
            font-size: 0.95rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .site-url {
            font-size: 0.7rem;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-box {
            width: 100%;
            max-width: 300px;
            margin-bottom: 15px;
            position: relative;
        }

        .info-box {
            width: 100%;
            padding: 12px 12px 12px 12px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: white;
            font-size: 0.8rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 0.9rem;
        }

        .btn {
            padding: 5px 5px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .footer {
            margin-top: auto;
            padding: 15px;
            font-size: 0.7rem;
            color: #444;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<script>
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clock').textContent = `${hours}:${minutes}`;

        const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
        const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
        const dayName = days[now.getDay()];
        const dateNum = String(now.getDate()).padStart(2, '0');
        const monthName = months[now.getMonth()];
        document.getElementById('date').textContent = `${dayName} ${dateNum} ${monthName}`;
    }

    updateClock();
    setInterval(updateClock, 1000);

    // 阻止双击缩放
    document.addEventListener('touchstart', function(event) {
        if (event.touches.length > 1) {
            event.preventDefault();
        }
    }, { passive: false });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
            event.preventDefault();
        }
        lastTouchEnd = now;
    }, false);

    // 检查是否应该显示提示框
    function checkNoticeStatus() {
        const isDismissed = localStorage.getItem('noticeDismissed');
        const noticeBox = document.getElementById('noticeBox');
        const resetSection = document.getElementById('resetSection');

        if (isDismissed === 'true') {
            // 用户之前选择过"不再显示"
            noticeBox.classList.add('hidden');
            resetSection.classList.add('visible');
        } else {
            // 显示提示框
            noticeBox.classList.remove('hidden');
            resetSection.classList.remove('visible');
        }
    }

    // 永久关闭（不再显示）
    function dismissForever() {
        // 保存状态到 localStorage
        localStorage.setItem('noticeDismissed', 'true');

        // 添加淡出动画
        const noticeBox = document.getElementById('noticeBox');
        noticeBox.style.animation = 'slideIn 0.3s ease-out reverse';

        setTimeout(() => {
            checkNoticeStatus();
            showStatus('已设置为不再显示 ✓', 'success');
        }, 300);
    }

    // 暂时关闭（下次还会显示）
    function dismissTemporarily() {
        const noticeBox = document.getElementById('noticeBox');
        noticeBox.style.animation = 'slideIn 0.3s ease-out reverse';

        setTimeout(() => {
            noticeBox.classList.add('hidden');
            showStatus('已暂时关闭，刷新页面后仍会显示', 'info');

            // 3秒后自动恢复（仅用于演示效果）
            setTimeout(() => {
                noticeBox.classList.remove('hidden');
                noticeBox.style.animation = 'slideIn 0.5s ease-out';
            }, 3000);
        }, 300);
    }

    // 重置状态
    function resetNotice() {
        localStorage.removeItem('noticeDismissed');
        checkNoticeStatus();

        const noticeBox = document.getElementById('noticeBox');
        noticeBox.style.animation = 'slideIn 0.5s ease-out';
        showStatus('状态已重置', 'info');
    }

    // 显示状态提示
    function showStatus(text, type) {
    }

    // 页面加载时检查状态
    checkNoticeStatus();

    // 监听 storage 变化（多标签页同步）
    window.addEventListener('storage', function(e) {
        if (e.key === 'noticeDismissed') {
            checkNoticeStatus();
        }
    });
</script>
